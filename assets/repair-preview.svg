<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">A clear repair decision, in the workshop</title>
  <desc id="desc">An illustrated service bay and vehicle behind an OpenHood phone screen. The screen shows a brake finding and sample itemized estimate. An advisor's card records a sample approval.</desc>
